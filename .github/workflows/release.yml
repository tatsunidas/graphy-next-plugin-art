# タグ v<version> を push すると、art-<version>.zip / .sha256 / .minisig / minisign.pub を
# 作って GitHub Release に添付する。GRAPHY-Next のプラグインマネージャはこの zip 資産
# （直下に plugin.json）を取得・検証・展開する。
#
# 雛形: GRAPHY-Next の examples/plugin-template/.github/workflows/release.yml
# 配布と検証の設計: GRAPHY-Next の fw/plugin-manager-design.md §2 / §5.1 / §5.2
name: Release plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # ステップ内 env は同じステップの if から参照できないため、ジョブレベルで公開する。
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 🔴 **配るものを、その場で作り直して突き合わせる。**
      #    ui.js はリポジトリにコミットしてある（開発機へ直接置く導入経路で要るため）が、
      #    src を直して再ビルドを忘れると **古い束ねを配ってしまう**。型・テストを通したうえで
      #    ビルドし、コミット済みの ui.js と**バイト単位で一致**することを確かめる。
      #    一致しなければリリースを止める——「配ったものが src と違う」は後から気付けない。
      - name: Verify and rebuild
        run: |
          npm ci
          npm run verify
          git diff --exit-code -- ui.js \
            || { echo "::error::ui.js がコミット済みのものと一致しません。npm run build して commit してください。"; exit 1; }

      - name: Resolve id / version
        id: meta
        run: |
          id=$(jq -r .id plugin.json)
          pjver=$(jq -r .version plugin.json)
          ver="${GITHUB_REF_NAME#v}"
          if [ "$pjver" != "$ver" ]; then
            echo "::error::plugin.json version ($pjver) != tag ($ver). 版とタグを一致させてください。"
            exit 1
          fi
          echo "id=$id"   >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Package zip (+ sha256)
        run: |
          name="${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.ver }}"
          mkdir -p pkg dist
          cp plugin.json ui.js pkg/
          (cd pkg && zip -r "../dist/$name.zip" .)     # 直下に plugin.json を置く（マネージャの前提）
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          ls -la dist

      # 署名。secrets に MINISIGN_SECRET_KEY / MINISIGN_PASSWORD が入っていれば走る。
      # 署名があると、本体の trusted-keys（公式鍵 98EA7C6BA2D50118）で検証が通り、
      # 利用者の導入は確認画面なしの「押すだけ」になる。未登録なら自動でスキップされ、
      # sha256 だけの配布物になる（導入はできるが確認画面を通る）。
      # ⚠ **2 つ揃ったときだけ走らせる。** 鍵だけ登録された状態で走らせると、パスフレーズが
      #   空のまま minisign が失敗し、**リリースそのものが落ちる**。片方しか無いなら署名を
      #   飛ばして sha256 だけの配布物を出すほうが、公開が止まるより良い。
      - name: Sign package
        if: ${{ env.MINISIGN_SECRET_KEY != '' && env.MINISIGN_PASSWORD != '' }}
        run: |
          if [ ! -f minisign.pub ]; then
            echo "::error::minisign.pub がリポジトリにありません"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          name="${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.ver }}"
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s /tmp/minisign.key \
            -m "dist/$name.zip" -t "$name" -x "dist/$name.zip.minisig"
          rm -f /tmp/minisign.key
          cp minisign.pub dist/
          # 🔴 自分の公開鍵で検証できることを**公開する前に**確かめる。
          #    署名が壊れていると、利用者側では「改竄された」と区別がつかない形で拒否される。
          minisign -V -p minisign.pub -m "dist/$name.zip" -x "dist/$name.zip.minisig"
          ls -la dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.ver }}.zip
            dist/${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.ver }}.zip.sha256
            dist/${{ steps.meta.outputs.id }}-${{ steps.meta.outputs.ver }}.zip.minisig
            dist/minisign.pub
